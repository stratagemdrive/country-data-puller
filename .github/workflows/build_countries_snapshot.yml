name: Build Countries Snapshot

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build_countries_snapshot.py"
      - ".github/workflows/build_countries_snapshot.yml"
      - "requirements.txt"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "snapshot-build"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Create docs/ directory
        run: mkdir -p docs

      - name: Build countries_snapshot.json
        run: python build_countries_snapshot.py
        env:
          PYTHONUNBUFFERED: "1"
          RESTCOUNTRIES_API_KEY: ${{ secrets.RESTCOUNTRIES_API_KEY }}

      - name: Verify output file
        run: |
          test -f docs/countries_snapshot.json || { echo "ERROR: snapshot not created"; exit 1; }
          python - <<'PY'
          import json, sys
          d = json.load(open('docs/countries_snapshot.json'))
          cs = d.get('countries', [])
          no_meta = [c['iso2'] for c in cs if not c['metadata'].get('capital') and not c['metadata'].get('population')]
          no_wgi  = [c['iso2'] for c in cs if c['worldBankGovernance'].get('overallPercentile') is None]
          no_exec = [c['iso2'] for c in cs if not c['executive']['executiveInPower'].get('leader')]
          print(f"Countries: {len(cs)}  generatedAt: {d.get('generatedAt')}")
          print(f"Missing metadata: {len(no_meta)} {no_meta}")
          print(f"Missing WGI:      {len(no_wgi)} {no_wgi}")
          print(f"Missing leader:   {len(no_exec)} {no_exec}")
          if len(cs) < 190 or len(no_meta) > 20:
              print("ERROR: output looks broken"); sys.exit(1)
          PY

      - name: Commit updated snapshot to repository
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/countries_snapshot.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-update countries_snapshot.json [$(date -u +%Y-%m-%dT%H:%M:%SZ)]"
            git fetch origin main
            git merge -X ours origin/main --no-edit || {
              git merge --abort 2>/dev/null || true
              git push --force-with-lease origin main
              exit 0
            }
            git push origin main
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
